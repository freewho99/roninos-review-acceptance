name: RoninOS Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Debug range
        run: |
          echo "base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }}"
          git log --oneline -3
          git diff --stat "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - uses: freewho99/roninos-review-action@v1.0.2
        with:
          github-token: ${{ github.token }}
          roninos-version: '3.0.0'
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
