name: RoninOS Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Debug CLI range
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "base=$BASE head=$HEAD_SHA"
          git rev-parse "$BASE...$HEAD_SHA" || true
          npx --yes roninos@3.0.0 audit "$BASE...$HEAD_SHA" --json > /tmp/debug-receipt.json || true
          head -c 1200 /tmp/debug-receipt.json
      - uses: freewho99/roninos-review-action@v1.0.2
        with:
          github-token: ${{ github.token }}
          roninos-version: '3.0.0'
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
